name: Manual Email Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send test email
        run: node test-email.js
        env:
          EMAIL_FUNCTION_URL: ${{ secrets.EMAIL_FUNCTION_URL }}
          EMAIL_FUNCTION_SECRET: ${{ secrets.EMAIL_FUNCTION_SECRET }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
